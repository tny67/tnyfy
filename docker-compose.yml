version: "3.8"

services:
  db:
    image: postgres:16-alpine
    container_name: tnyfy-db
    environment:
      POSTGRES_USER: tnyfy
      POSTGRES_PASSWORD: tnyfy_dev_2024
      POSTGRES_DB: tnyfy
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tnyfy"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: tnyfy-redis
    ports:
      - "6379:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  pgdata:
  redisdata:
