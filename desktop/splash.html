<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-app-region: drag;
      user-select: none;
    }
    .splash {
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
      border: 1px solid #2a2a3e;
      border-radius: 24px;
      padding: 48px 64px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      width: 420px;
    }
    .logo {
      width: 80px;
      height: 80px;
      background: linear-gradient(135deg, #6c5ce7, #a29bfe);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      margin: 0 auto 24px;
      position: relative;
    }
    .logo-letter {
      font-size: 48px;
      font-weight: 900;
      color: white;
    }
    .logo-dot {
      position: absolute;
      top: 8px;
      right: 8px;
      width: 14px;
      height: 14px;
      background: #00b894;
      border-radius: 50%;
      border: 2px solid #0a0a0f;
    }
    h1 {
      color: #e4e4ef;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    h1 span { color: #6c5ce7; }
    .subtitle {
      color: #8888a4;
      font-size: 12px;
      margin-bottom: 32px;
    }
    .loader {
      width: 200px;
      height: 3px;
      background: #2a2a3e;
      border-radius: 2px;
      margin: 0 auto 16px;
      overflow: hidden;
    }
    .loader-bar {
      height: 100%;
      background: linear-gradient(90deg, #6c5ce7, #a29bfe);
      border-radius: 2px;
      animation: loading 2.5s ease-in-out infinite;
    }
    @keyframes loading {
      0% { width: 0%; margin-left: 0; }
      50% { width: 60%; margin-left: 20%; }
      100% { width: 0%; margin-left: 100%; }
    }
    .status {
      color: #8888a4;
      font-size: 11px;
      animation: pulse 1.5s ease-in-out infinite;
    }
    @keyframes pulse {
      0%, 100% { opacity: 0.5; }
      50% { opacity: 1; }
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">
      <span class="logo-letter">T</span>
      <div class="logo-dot"></div>
    </div>
    <h1><span>tnyfy</span></h1>
    <p class="subtitle">AI-Powered E-Commerce Automation</p>
    <div class="loader"><div class="loader-bar"></div></div>
    <p class="status">Demarrage des services IA...</p>
  </div>
</body>
</html>
