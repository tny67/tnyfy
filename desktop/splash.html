<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
      background: transparent;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
      -webkit-app-region: drag;
      user-select: none;
    }
    .splash {
      background: linear-gradient(135deg, #0a0a0f 0%, #1a1a2e 100%);
      border: 1px solid #2a2a3e;
      border-radius: 24px;
      padding: 48px 64px;
      text-align: center;
      box-shadow: 0 20px 60px rgba(0,0,0,0.5);
      width: 440px;
    }
    .logo {
      width: 90px;
      height: 90px;
      margin: 0 auto 24px;
      animation: logoPulse 2s ease-in-out infinite;
      border-radius: 20px;
    }
    .logo img {
      width: 100%;
      height: 100%;
      border-radius: 20px;
      object-fit: contain;
    }
    @keyframes logoPulse {
      0%, 100% { filter: drop-shadow(0 0 15px rgba(108, 92, 231, 0.4)); }
      50% { filter: drop-shadow(0 0 30px rgba(108, 92, 231, 0.7)); }
    }
    h1 {
      color: #e4e4ef;
      font-size: 28px;
      font-weight: 700;
      margin-bottom: 8px;
    }
    h1 span { color: #6c5ce7; }
    .subtitle {
      color: #8888a4;
      font-size: 12px;
      margin-bottom: 28px;
    }

    /* Steps */
    .steps {
      text-align: left;
      margin-bottom: 24px;
    }
    .step {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 6px 0;
      font-size: 12px;
      color: #555570;
      transition: color 0.3s ease;
    }
    .step.active {
      color: #a29bfe;
    }
    .step.done {
      color: #00b894;
    }
    .step.error {
      color: #e74c3c;
    }
    .step-icon {
      width: 18px;
      height: 18px;
      border-radius: 50%;
      border: 2px solid #333;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      flex-shrink: 0;
      transition: all 0.3s ease;
    }
    .step.active .step-icon {
      border-color: #6c5ce7;
      animation: spin 1s linear infinite;
    }
    .step.done .step-icon {
      border-color: #00b894;
      background: #00b894;
    }
    .step.error .step-icon {
      border-color: #e74c3c;
      background: #e74c3c;
    }
    @keyframes spin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }

    /* Progress bar */
    .progress-container {
      width: 100%;
      height: 3px;
      background: #2a2a3e;
      border-radius: 2px;
      margin-bottom: 12px;
      overflow: hidden;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #6c5ce7, #a29bfe, #00b894);
      border-radius: 2px;
      width: 0%;
      transition: width 0.5s ease;
    }

    .status-text {
      color: #8888a4;
      font-size: 10px;
      min-height: 14px;
    }
  </style>
</head>
<body>
  <div class="splash">
    <div class="logo">
      <img src="icon.png" alt="Tnyfy">
    </div>
    <h1><span>tnyfy</span></h1>
    <p class="subtitle">AI-Powered E-Commerce Automation</p>

    <div class="steps">
      <div class="step" id="step-docker">
        <div class="step-icon"></div>
        <span>Base de donnees</span>
      </div>
      <div class="step" id="step-backend">
        <div class="step-icon"></div>
        <span>Moteur IA</span>
      </div>
      <div class="step" id="step-frontend">
        <div class="step-icon"></div>
        <span>Interface dashboard</span>
      </div>
      <div class="step" id="step-ready">
        <div class="step-icon"></div>
        <span>Finalisation</span>
      </div>
    </div>

    <div class="progress-container">
      <div class="progress-bar" id="progress"></div>
    </div>
    <p class="status-text" id="status"></p>
  </div>

  <script>
    const { ipcRenderer } = require('electron');

    ipcRenderer.on('splash-status', (event, data) => {
      const { step, state, message, progress } = data;

      // Update step state
      if (step) {
        const el = document.getElementById('step-' + step);
        if (el) {
          el.className = 'step ' + state;
          if (state === 'done') {
            el.querySelector('.step-icon').innerHTML = '✓';
          } else if (state === 'error') {
            el.querySelector('.step-icon').innerHTML = '✗';
          }
        }
      }

      // Update progress bar
      if (progress !== undefined) {
        document.getElementById('progress').style.width = progress + '%';
      }

      // Update status text
      if (message) {
        document.getElementById('status').textContent = message;
      }
    });
  </script>
</body>
</html>
