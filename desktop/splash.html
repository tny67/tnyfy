<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body {
      overflow: hidden;
      width: 100%;
      height: 100%;
      background: #13112a;
    }
    body {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      -webkit-app-region: drag;
      user-select: none;
    }
    ::-webkit-scrollbar { display: none; }

    .banner {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      width: 100%;
    }
    .banner img {
      max-width: 70%;
      max-height: 70%;
      object-fit: contain;
    }

    .progress-container {
      width: 200px;
      height: 3px;
      background: rgba(255,255,255,0.1);
      border-radius: 2px;
      overflow: hidden;
      margin-bottom: 40px;
    }
    .progress-bar {
      height: 100%;
      background: linear-gradient(90deg, #6c5ce7, #a29bfe);
      border-radius: 2px;
      width: 0%;
      transition: width 0.5s ease;
    }
  </style>
</head>
<body>
  <div class="banner">
    <img src="splash_banner.png" alt="tnyfy">
  </div>
  <div class="progress-container">
    <div class="progress-bar" id="progress"></div>
  </div>

  <script>
    const { ipcRenderer } = require('electron');
    ipcRenderer.on('splash-status', (event, data) => {
      if (data.progress !== undefined) {
        document.getElementById('progress').style.width = data.progress + '%';
      }
    });
  </script>
</body>
</html>
